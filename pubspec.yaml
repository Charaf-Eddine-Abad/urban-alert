name: urban_alert
description: UrbanAlert — Application citoyenne de signalement urbain pour le Maroc.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # ── State management ─────────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1

  # ── Navigation ───────────────────────────────────────────────────────────────
  go_router: ^14.6.2

  # ── Networking ───────────────────────────────────────────────────────────────
  dio: ^5.9.2

  # ── Secure storage ───────────────────────────────────────────────────────────
  flutter_secure_storage: ^10.3.1

  # ── Real-time / WebSocket ────────────────────────────────────────────────────
  stomp_dart_client: ^3.0.1

  # ── Maps & Location ──────────────────────────────────────────────────────────
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^14.0.3

  # ── Media ────────────────────────────────────────────────────────────────────
  image_picker: ^1.2.2
  cached_network_image: ^3.4.1

  # ── Value equality (used by domain models) ───────────────────────────────────
  equatable: ^2.0.5

  # ── UI / Typography ──────────────────────────────────────────────────────────
  google_fonts: ^8.1.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
